# IPX - JOIN side. For any demo that plays two-player over IPX. Mounts C:,
# loads sound/music drivers, and connects to the IPX server; cd to the
# demo's folder and run it yourself once in DOSBox-X.
[dosbox]
machine=svga_s3
vmemsize=8
memsize=32
[joystick]
joysticktype=fcs
timed=false
[ipx]
ipx=true
[autoexec]
@echo off
mount c .
mount d audio/DRIVERS
d:
soundrv
midpak
c:
ipxnet connect 127.0.0.1
