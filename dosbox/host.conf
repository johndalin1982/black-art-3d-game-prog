# IPX - HOST side. For any demo that plays two-player over IPX. Mounts C:,
# loads sound/music drivers, and starts the IPX server - cd to the demo's
# folder and run it yourself once in DOSBox-X.
# vmemsize=8 needed for 1024x768x32 (3 MB/page x2 = 6 MB)
[dosbox]
machine=svga_s3
vmemsize=8
memsize=32
[joystick]
joysticktype=fcs
timed=false
[ipx]
ipx=true
[autoexec]
@echo off
mount c .
mount d audio/DRIVERS
d:
soundrv
midpak
c:
ipxnet startserver
