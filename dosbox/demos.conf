# Any single, non-networked demo. Mounts C: and loads sound/music drivers -
# cd to the demo's folder and run it yourself.
# vmemsize=8 needed for 1024x768x32 (3 MB/page x2 = 6 MB)
[dosbox]
machine=svga_s3
vmemsize=8
memsize=32
[joystick]
joysticktype=fcs
timed=false
[autoexec]
@echo off
mount c .
mount d audio/DRIVERS
d:
soundrv
midpak
c:
echo.
echo  cd folder
echo  program
echo.
