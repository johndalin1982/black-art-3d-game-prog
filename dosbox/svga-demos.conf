# svga-demos.conf - SVGA demos (640x480x8 / 800x600x16 / 1024x768x32)
# Run from repo root: dosbox-x -conf dosbox\svga-demos.conf
# vmemsize=8 needed for 1024x768x32 (3 MB/page x2 = 6 MB)
[dosbox]
machine=svga_s3
vmemsize=8
memsize=32
[autoexec]
@echo off
mount c .
c:
echo.
echo  cd folder
echo  program
echo.
