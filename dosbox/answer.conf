# Modem - ANSWER side. For any demo that dials/answers over modem. Mounts C:
# and loads sound/music drivers; cd to the demo's folder and run it
# yourself once in DOSBox-X.
[dosbox]
machine=svga_s3
vmemsize=8
memsize=32
[joystick]
joysticktype=fcs
timed=false
[serial]
serial1=modem listenport:5000
phonebookfile=phonebook.txt
[autoexec]
@echo off
mount c .
mount d audio/DRIVERS
d:
soundrv
midpak
c:
